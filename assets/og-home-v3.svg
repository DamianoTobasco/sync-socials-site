<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Your socials. On autopilot. | Sync Socials</title>
  <desc>Social preview designed for small cards: a large headline, three illustrated actions, and one clear call to action. Export at 1200 by 630 pixels.</desc>
  <rect width="1200" height="630" fill="#f6f5f0"/>

  <!-- Brand -->
  <svg x="44" y="42" width="66" height="66" viewBox="0 0 64 64">
    <rect width="64" height="64" rx="14" fill="#0c1410"/>
    <g transform="translate(0 1.5)">
      <g stroke="#4fbe7a" stroke-width="3.4" stroke-linecap="round" fill="none">
        <path d="M32 9V2M25.5 10.2 22 3.6M38.5 10.2 42 3.6M20.4 13.2 15.8 7.8M43.6 13.2 48.2 7.8"/>
      </g>
      <path fill="#f6f5f0" d="M30 16 9 53l21-7zM34 16l21 37-21-7zM32 14.5 34.6 46 32 57l-2.6-11z"/>
    </g>
  </svg>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="126" y="91" font-size="43" font-weight="700" letter-spacing="-1.3" fill="#17281d">Sync Socials</text>

    <!-- Keep the complete message readable at a 320px card width. -->
    <text x="39" y="251" font-size="100" font-weight="700" letter-spacing="-4.5" fill="#17281d">Your socials.</text>
    <text x="39" y="357" font-size="100" font-weight="700" letter-spacing="-4.5" fill="#248551">On autopilot.</text>
    <text x="46" y="425" font-size="34" font-weight="500" fill="#354e3e">AI content. Scheduled for you.</text>

    <rect x="44" y="483" width="574" height="102" rx="21" fill="#1e6b42"/>
    <text x="78" y="548" font-size="39" font-weight="700" fill="#fff">Try 7 days free</text>
    <path d="M521 534h49m-17-17 17 17-17 17" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Enlarged workflow: strong silhouettes, short labels, no fine print. -->
    <rect x="714" y="36" width="450" height="558" rx="34" fill="#102c1d"/>
    <text x="939" y="100" text-anchor="middle" font-size="29" font-weight="700" fill="#b8e3c7">One workspace.</text>

    <rect x="738" y="137" width="402" height="124" rx="22" fill="#214530"/>
    <rect x="738" y="290" width="402" height="124" rx="22" fill="#214530"/>
    <rect x="738" y="443" width="402" height="124" rx="22" fill="#214530"/>
    <path d="M939 268v13m-7-6 7 7 7-7M939 421v13m-7-6 7 7 7-7" fill="none" stroke="#78c695" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="855" y="216" font-size="46" font-weight="700" letter-spacing="-1" fill="#fff">Create</text>
    <text x="855" y="369" font-size="46" font-weight="700" letter-spacing="-1" fill="#fff">Schedule</text>
    <text x="855" y="522" font-size="46" font-weight="700" letter-spacing="-1" fill="#fff">Publish</text>
  </g>

  <!-- Sparkles: create with AI. -->
  <g fill="#9be9b5">
    <path d="m794 164 10 24 24 10-24 10-10 24-10-24-24-10 24-10Z"/>
    <path d="m825 163 4 10 10 4-10 4-4 10-4-10-10-4 10-4Z"/>
  </g>

  <!-- Calendar: schedule. -->
  <g fill="none" stroke="#9be9b5" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="767" y="325" width="62" height="56" rx="9"/>
    <path d="M780 318v14m36-14v14m-47 13h58m-44 20 9 9 18-19"/>
  </g>

  <!-- Paper plane: publish. -->
  <path d="m766 504 65-28-19 65-16-25-30-12Z" fill="#9be9b5"/>
  <path d="m796 516 21-25" fill="none" stroke="#214530" stroke-width="4" stroke-linecap="round"/>
</svg>
